name: ezboai_mobile
description: "EzboAI - All-in-One AI Powerhouse Cross-Platform Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Streaming
  dio: ^5.4.3+1
  http: ^1.2.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI & Typography
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # Markdown & Syntax Highlighting
  flutter_markdown: ^0.7.2+1
  flutter_highlight: ^0.7.0

  # Audio & Video Media
  just_audio: ^0.9.38
  audio_video_progress_bar: ^2.0.3
  video_player: ^2.8.6
  chewie: ^1.8.1
  record: ^5.1.2

  # Pickers & Utilities
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  gallery_saver_plus: ^3.0.0
  url_launcher: ^6.2.6
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
